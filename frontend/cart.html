<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Cart</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a href="index.html" class="logo">🛍️ SimpleShop</a><nav><a href="index.html">Home</a><a href="cart.html" class="active">Cart</a></nav></header>
<main>
  <h2>Your Cart</h2>
  <div id="cart" style="margin-top:1rem;"></div>
</main>
<script src="js/app.js"></script>
<script>
async function render() {
  const c = getCart();
  if(!c.length) return document.getElementById('cart').innerHTML = '<p>Your cart is empty.</p>';
  const prods = await Promise.all(c.map(i => api(`/products/${i.productId}`)));
  let total = 0;
  let html = '<div style="background:white;padding:1.5rem;border-radius:8px;">';
  c.forEach((it, idx) => {
    const p = prods[idx];
    const sub = (p.price_cents * it.quantity)/100;
    total += sub;
    html += `<div style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid #e2e8f0;">
      <span><strong>${p.name}</strong> (x${it.quantity})</span>
      <span>$${sub.toFixed(2)}</span>
      <button class="btn btn-danger" onclick="del(${p.id})">Remove</button>
    </div>`;
  });
  html += `<h3>Total: $${total.toFixed(2)}</h3><br><a href="checkout.html" class="btn">Checkout</a></div>`;
  document.getElementById('cart').innerHTML = html;
}
function del(id) { saveCart(getCart().filter(i => i.productId !== id)); render(); }
render();
</script>
</body>
</html>
