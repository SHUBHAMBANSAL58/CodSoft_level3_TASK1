<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a href="index.html" class="logo">🛍️ SimpleShop</a><nav><a href="index.html">Home</a></nav></header>
<main><div class="form-box">
  <h2>Login</h2>
  <form id="f">
    <input type="email" id="e" placeholder="Email" required>
    <input type="password" id="p" placeholder="Password" required>
    <button class="btn" style="width:100%;">Sign In</button>
    <p style="margin-top:1rem;text-align:center;">No account? <a href="register.html">Register</a></p>
  </form>
</div></main>
<script src="js/app.js"></script>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    await api('/auth/login', { method:'POST', body: JSON.stringify({ email: e.value, password: p.value }) });
    location.href = 'index.html';
  } catch(err) { alert(err.message); }
};
</script>
</body>
</html>
