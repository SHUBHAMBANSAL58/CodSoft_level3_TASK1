<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Checkout</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a href="index.html" class="logo">🛍️ SimpleShop</a><nav><a href="index.html">Home</a></nav></header>
<main><div class="form-box">
  <h2>Checkout</h2>
  <form id="f">
    <textarea id="addr" placeholder="Shipping Address..." rows="3" required></textarea>
    <button class="btn" style="width:100%;">Confirm Order</button>
  </form>
</div></main>
<script src="js/app.js"></script>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const cart = getCart();
  if(!cart.length) return alert('Cart is empty');
  try {
    const res = await api('/orders', { method:'POST', body: JSON.stringify({ items: cart, shippingAddress: addr.value }) });
    localStorage.removeItem(CART_KEY);
    alert('Order placed successfully! #' + res.orderId);
    location.href = 'orders.html';
  } catch(err) {
    if(err.message.includes('log in')) location.href = 'login.html';
    else alert(err.message);
  }
};
</script>
</body>
</html>
